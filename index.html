<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulário CostDrivers</title>

  <style>
    /*
     * Este formulário usa o editor NOVO do HubSpot (Forms V4), que renderiza
     * com classes `hsfc-*`. Os seletores legacy (.hs-form, .hs-input, .hs-button,
     * .hs-error-msgs) são do editor antigo e não existem neste markup.
     *
     * Paleta extraída do tema oficial do site (gepcostdrivers/geral.css),
     * onde --azul-escuro: #042373 é a variável de marca declarada.
     */

    :root {
      /* Azuis institucionais */
      --cd-azul-escuro:   #042373;
      --cd-azul-marinho:  #001e76;
      --cd-azul:          #0047af;
      --cd-azul-hover:    #064bb1;
      --cd-azul-brilho:   #00a3ff;

      /* Cianos de destaque */
      --cd-ciano:         #65e2f9;
      --cd-ciano-claro:   #96e1f8;

      /* Sinalização */
      --cd-erro:          #ff6365;
      --cd-sucesso:       #54ba5f;

      /* Neutros */
      --cd-texto:         #171714;
      --cd-texto-suave:   #5b6472;
      --cd-borda:         #e4e4e4;
      --cd-fundo-campo:   #f6f6f6;
      --cd-branco:        #ffffff;
    }

    * { box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(160deg, var(--cd-azul-escuro) 0%, var(--cd-azul-marinho) 55%, #011049 100%);
      background-attachment: fixed;
      padding: 48px 16px;
      margin: 0;
      color: var(--cd-texto);
    }

    /* ---- Container (card) ---- */
    .hs-form-html {
      position: relative;
      max-width: 580px;
      margin: 0 auto;
      background: var(--cd-branco);
      padding: 44px 40px 40px;
      border-radius: 14px;
      border: 1px solid var(--cd-borda);
      box-shadow: 0 18px 40px -12px rgba(4, 35, 115, 0.45),
                  0 6px 14px -8px rgba(0, 30, 118, 0.30);
      overflow: hidden;
    }

    /* Faixa de marca no topo do card */
    .hs-form-html::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 5px;
      background: linear-gradient(90deg,
        var(--cd-azul-marinho) 0%,
        var(--cd-azul) 40%,
        var(--cd-azul-brilho) 75%,
        var(--cd-ciano) 100%);
    }

    .hs-form-html .hsfc-FormWrapper,
    .hs-form-html .hsfc-Form,
    .hs-form-html .hsfc-Step__Content {
      background: transparent;
      padding: 0;
      border: none;
      box-shadow: none;
    }

    /* ---- Cabeçalho ---- */
    .hs-form-html .hsfc-Heading {
      color: var(--cd-azul-escuro);
      font-size: 1.4rem;
      font-weight: 700;
      line-height: 1.3;
      letter-spacing: -0.01em;
      margin-bottom: 6px;
    }

    .hs-form-html .hsfc-RichText {
      color: var(--cd-texto-suave);
      font-size: 0.9rem;
      line-height: 1.6;
    }

    .hs-form-html .hsfc-RichText a {
      color: var(--cd-azul);
      font-weight: 500;
      text-underline-offset: 2px;
    }

    .hs-form-html .hsfc-RichText a:hover { color: var(--cd-azul-brilho); }

    /* ---- Espaçamento entre campos ---- */
    .hs-form-html .hsfc-Row { margin-bottom: 22px; }

    /* ---- Labels ---- */
    .hs-form-html .hsfc-FieldLabel {
      display: block;
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--cd-azul-escuro);
      margin-bottom: 6px;
      line-height: 1.4;
    }

    .hs-form-html .hsfc-FieldLabel__RequiredIndicator {
      color: var(--cd-erro);
      margin-left: 2px;
    }

    .hs-form-html .hsfc-FieldDescription {
      font-size: 0.8rem;
      color: var(--cd-texto-suave);
      margin-bottom: 6px;
    }

    /* ---- Inputs, textarea e dropdown ---- */
    .hs-form-html .hsfc-TextInput,
    .hs-form-html .hsfc-TextareaInput,
    .hs-form-html .hsfc-DropdownInput,
    .hs-form-html .hsfc-DateInput,
    .hs-form-html .hsfc-PhoneInput {
      width: 100%;
      padding: 12px 16px;
      font-family: inherit;
      font-size: 0.95rem;
      line-height: 1.5;
      color: var(--cd-texto);
      background-color: var(--cd-fundo-campo);
      border: 1.5px solid var(--cd-borda);
      border-radius: 8px;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
    }

    .hs-form-html .hsfc-TextInput:hover,
    .hs-form-html .hsfc-TextareaInput:hover,
    .hs-form-html .hsfc-DropdownInput:hover {
      border-color: #c7d4e6;
    }

    .hs-form-html .hsfc-TextareaInput {
      min-height: 120px;
      padding: 14px 16px;
      resize: vertical;
    }

    /* O dropdown do HubSpot é um botão, não um <select> */
    .hs-form-html .hsfc-DropdownInput {
      display: flex;
      align-items: center;
      justify-content: space-between;
      text-align: left;
      cursor: pointer;
    }

    .hs-form-html .hsfc-DropdownInput__Caret { color: var(--cd-azul); }

    /* ---- Foco ---- */
    .hs-form-html .hsfc-TextInput:focus,
    .hs-form-html .hsfc-TextareaInput:focus,
    .hs-form-html .hsfc-DropdownInput:focus,
    .hs-form-html .hsfc-DateInput:focus,
    .hs-form-html .hsfc-PhoneInput:focus-within {
      background-color: var(--cd-branco);
      border-color: var(--cd-azul-brilho);
      box-shadow: 0 0 0 4px rgba(0, 163, 255, 0.18);
    }

    .hs-form-html ::placeholder { color: #9aa4b2; }

    /* ---- Lista de opções do dropdown ---- */
    .hs-form-html .hsfc-DropdownOptions {
      background: var(--cd-branco);
      border: 1.5px solid var(--cd-borda);
      border-radius: 8px;
      box-shadow: 0 12px 28px rgba(4, 35, 115, 0.18);
      overflow: hidden;
    }

    .hs-form-html .hsfc-DropdownOptions__Search {
      padding: 10px 14px;
      border-bottom: 1px solid var(--cd-borda);
    }

    .hs-form-html .hsfc-DropdownOptions__List__ListItem {
      padding: 10px 16px;
      font-size: 0.92rem;
      color: var(--cd-texto);
      cursor: pointer;
    }

    .hs-form-html .hsfc-DropdownOptions__List__ListItem:hover {
      background: linear-gradient(90deg, rgba(101, 226, 249, 0.22) 0%, rgba(0, 163, 255, 0.10) 100%);
      color: var(--cd-azul-escuro);
    }

    /* ---- Upload de arquivo ---- */
    .hs-form-html .hsfc-FileInput,
    .hs-form-html .hsfc-FileInputAsync {
      width: 100%;
      padding: 14px 16px;
      font-size: 0.9rem;
      color: var(--cd-texto-suave);
      background-color: rgba(150, 225, 248, 0.10);
      border: 1.5px dashed var(--cd-ciano-claro);
      border-radius: 8px;
      transition: border-color 0.2s ease, background-color 0.2s ease;
    }

    .hs-form-html .hsfc-FileInput:hover,
    .hs-form-html .hsfc-FileInputAsync:hover {
      border-color: var(--cd-azul-brilho);
      background-color: rgba(0, 163, 255, 0.07);
    }

    .hs-form-html .hsfc-FileInputAsync__Progress { background-color: var(--cd-azul-brilho); }
    .hs-form-html .hsfc-FileInputAsync__CompleteIcon { color: var(--cd-sucesso); }

    /* ---- Erros de validação ---- */
    .hs-form-html .hsfc-FieldFooter {
      font-size: 0.8rem;
      color: var(--cd-erro);
      font-weight: 500;
      margin-top: 6px;
    }

    .hs-form-html .hsfc-ErrorAlert {
      font-size: 0.85rem;
      color: #b3262d;
      font-weight: 500;
      background-color: #fff2f2;
      border: 1px solid rgba(255, 99, 101, 0.45);
      border-left: 4px solid var(--cd-erro);
      border-radius: 8px;
      padding: 12px 14px;
      margin-bottom: 14px;
    }

    .hs-form-html [aria-invalid="true"] {
      border-color: var(--cd-erro);
      background-color: #fff2f2;
    }

    .hs-form-html [aria-invalid="true"]:focus {
      box-shadow: 0 0 0 4px rgba(255, 99, 101, 0.18);
    }

    /* ---- Botão de envio ---- */
    .hs-form-html .hsfc-NavigationRow { margin-top: 10px; }
    .hs-form-html .hsfc-NavigationRow__Buttons { width: 100%; }

    .hs-form-html .hsfc-Button {
      width: 100%;
      padding: 15px 24px;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.01em;
      color: var(--cd-branco);
      background: linear-gradient(135deg, var(--cd-azul-marinho) 0%, var(--cd-azul) 55%, var(--cd-azul-brilho) 100%);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.25s ease, box-shadow 0.25s ease, transform 0.2s ease;
      box-shadow: 0 6px 16px rgba(0, 71, 175, 0.32);
    }

    .hs-form-html .hsfc-Button:hover {
      background: linear-gradient(135deg, var(--cd-azul) 0%, var(--cd-azul-brilho) 60%, var(--cd-ciano) 100%);
      box-shadow: 0 8px 22px rgba(0, 163, 255, 0.40);
      transform: translateY(-1px);
    }

    .hs-form-html .hsfc-Button:focus-visible {
      outline: 3px solid var(--cd-ciano);
      outline-offset: 2px;
    }

    .hs-form-html .hsfc-Button:active {
      transform: translateY(0);
      box-shadow: 0 3px 8px rgba(4, 35, 115, 0.28);
    }

    .hs-form-html .hsfc-Button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    /* ---- Mensagem pós-envio ---- */
    .hs-form-html .hsfc-PostSubmit {
      color: var(--cd-azul-escuro);
      font-size: 0.95rem;
      line-height: 1.6;
      text-align: center;
    }

    /* ---- Responsivo ---- */
    @media (max-width: 600px) {
      body { padding: 24px 12px; }
      .hs-form-html { padding: 32px 22px 28px; border-radius: 12px; }
      .hs-form-html .hsfc-Heading { font-size: 1.2rem; }
    }
  </style>
</head>
<body>
