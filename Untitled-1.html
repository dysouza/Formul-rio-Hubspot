<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulário CostDrivers</title>
  
  <style>
    /* Reset básico e tipografia */
    * {
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background-color: #25313d;
      padding: 40px 16px;
      margin: 0;
    }

    /* Container do Formulário */
    .hs-form-html,
    .hs-form {
      max-width: 560px;
      margin: 0 auto;
      background: #ffffff;
      padding: 40px 36px;
      border-radius: 12px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 10px 25px -5px rgba(13, 37, 56, 0.08), 0 8px 10px -6px rgba(13, 37, 56, 0.04);
    }

    /* Espaçamento entre os campos */
    .hs-form-field,
    .hs-fieldtype-text,
    .hs-fieldtype-select {
      margin-bottom: 22px;
    }

    /* Rótulos dos campos (Labels) */
    .hs-form-html label,
    .hs-form label {
      display: block;
      font-size: 0.875rem;
      font-weight: 600;
      color: #0d2538; /* Azul escuro CostDrivers */
      margin-bottom: 6px;
    }

    .hs-form-required {
      color: #ef4444;
      margin-left: 2px;
    }
    /* Customização do Textarea do HubSpot (hsfc-TextareaInput) */
.hs-form-html textarea,
.hs-form textarea,
textarea.hsfc-TextareaInput,
textarea[data-hsfc-id="TextareaInput"] {
  width: 100% !important;
  min-height: 120px !important; /* Altura ideal confortável para digitação */
  padding: 14px 16px !important;
  font-family: inherit !important;
  font-size: 0.95rem !important;
  line-height: 1.5 !important;
  color: #1e293b !important;
  background-color: #f8fafc !important;
  border: 1.5px solid #cbd5e1 !important;
  border-radius: 8px !important;
  outline: none !important;
  resize: vertical !important; /* Permite o usuário esticar apenas na vertical */
  box-sizing: border-box !important;
  transition: all 0.2s ease-in-out !important;
}

/* Efeito de Foco no Textarea */
textarea.hsfc-TextareaInput:focus,
textarea[data-hsfc-id="TextareaInput"]:focus {
  background-color: #ffffff !important;
  border-color: #0077c8 !important; /* Azul/Ciano CostDrivers */
  box-shadow: 0 0 0 4px rgba(0, 119, 200, 0.15) !important;
}

/* Estado de Erro de Validação (quando aria-invalid="true") */
textarea.hsfc-TextareaInput[aria-invalid="true"],
textarea[data-hsfc-id="TextareaInput"][aria-invalid="true"] {
  border-color: #dc2626 !important;
  background-color: #fef2f2 !important;
}

textarea.hsfc-TextareaInput[aria-invalid="true"]:focus,
textarea[data-hsfc-id="TextareaInput"][aria-invalid="true"]:focus {
  box-shadow: 0 0 0 4px rgba(220, 38, 38, 0.15) !important;
}
    /* Estilo dos Inputs, Selects e Textareas */
    .hs-form-html input[type="text"],
    .hs-form-html input[type="email"],
    .hs-form-html input[type="tel"],
    .hs-form-html input[type="number"],
    .hs-form-html select,
    .hs-form-html textarea,
    .hs-input {
      width: 100%;
      padding: 12px 16px;
      font-size: 0.95rem;
      color: #1e293b;
      background-color: #f8fafc;
      border: 1.5px solid #cbd5e1;
      border-radius: 8px;
      outline: none;
      transition: all 0.2s ease-in-out;
    }

    /* Efeito de foco (Highlight Ciano / Azul Tecnologia) */
    .hs-form-html input:focus,
    .hs-form-html select:focus,
    .hs-form-html textarea:focus,
    .hs-input:focus {
      background-color: #ffffff;
      border-color: #0077c8;
      box-shadow: 0 0 0 4px rgba(0, 119, 200, 0.15);
    }

    /* Placeholder */
    .hs-input::placeholder {
      color: #94a3b8;
    }

    /* Mensagens de Erro de Validação */
    .hs-error-msgs,
    ul.hs-error-msgs {
      list-style: none;
      padding: 0;
      margin: 6px 0 0 0;
    }

    .hs-error-msgs label,
    .hs-error-msgs li {
      font-size: 0.8rem;
      color: #dc2626 !important;
      font-weight: 500;
    }

    /* Botão de Envio (Gradiente Azul GEP) */
    .hs-form-html input[type="submit"],
    .hs-form-html button[type="submit"],
    .hs-button {
      width: 100%;
      padding: 14px 24px;
      font-size: 1rem;
      font-weight: 600;
      color: #ffffff;
      background: linear-gradient(135deg, #0d2538 0%, #005691 100%);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 8px;
      transition: all 0.25s ease;
      box-shadow: 0 4px 12px rgba(13, 37, 56, 0.18);
    }

    .hs-form-html input[type="submit"]:hover,
    .hs-form-html button[type="submit"]:hover,
    .hs-button:hover {
      background: linear-gradient(135deg, #13334d 0%, #0077c8 100%);
      box-shadow: 0 6px 18px rgba(0, 119, 200, 0.28);
      transform: translateY(-1px);
    }

    .hs-form-html input[type="submit"]:active,
    .hs-form-html button[type="submit"]:active,
    .hs-button:active {
      transform: translateY(0);
      box-shadow: 0 2px 6px rgba(13, 37, 56, 0.2);
      
    }
  </style>
</head>
<body>

  <!-- Código de incorporação do desenvolvedor -->
  <script src="https://js-eu1.hsforms.net/forms/embed/developer/5253226.js" defer></script>

</body>
</html>
